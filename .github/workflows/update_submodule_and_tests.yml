name: Update Submodule and Run Tests

on:
  schedule:
    - cron: '0 12 * * 4'  # Runs weekly on Thursday at midday
  workflow_dispatch:

env:
  PY_COLORS: 1
  PYTEST_ADDOPTS: "--numprocesses=logical"

permissions:
  contents: write
  pull-requests: write

jobs:
  pytest:
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"
          cache-suffix: pytest-${{ matrix.python-version }}
          cache-dependency-glob: "pyproject.toml"
      - name: update-submodule
        # track narwhals releases (v* tags), not the main branch
        run: |
          git submodule update --init --recursive
          git -C narwhals fetch --tags --quiet origin
          tag=$(git -C narwhals tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          git -C narwhals checkout --quiet "$tag"
          echo "narwhals at $tag"
      - name: install-reqs
        # without the extra the regenerated skip list would deselect mode/skew/kurtosis
        run: uv sync --group tests --extra extra-functions
      - name: show-deps
        run: uv pip freeze
      - name: update-tests
        run: uv run --group tests python update_run_tests.py
      - name: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: auto-update tests and submodule'
          title: 'chore: auto-update tests and submodule'
          branch: chore/test-and-submodule-auto-updates
          delete-branch: true

  latest-datafusion:
    # Early warning: newest datafusion past the cap, both suites. Red means work
    # before the cap moves, not broken users. No extra (its shim would hold
    # datafusion at its own major), so its three tests are excluded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: install-reqs
        # `uv pip install` ignores the project bounds; `--no-sync` below keeps
        # `uv run` from restoring the locked version
        run: |
          uv sync --group tests
          uv pip install --upgrade datafusion
      - name: show-deps
        run: uv pip freeze | grep -i datafusion
      - name: Run local tests
        run: uv run --no-sync pytest tests
      - name: Run narwhals test suite
        run: uv run --no-sync python run_tests.py -k "not mode and not skew and not kurtosis"
