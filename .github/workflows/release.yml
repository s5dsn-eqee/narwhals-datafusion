name: Release

# test -> build -> publish to PyPI (trusted publishing) -> signed GitHub release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  test:
    # gate: never publish a tag whose tests don't pass
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: "--numprocesses=logical"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run tests
        run: |
          uv sync --group tests --extra extra-functions
          uv run --group tests pytest tests
          uv run --group tests python run_tests.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: uv build
      - name: Validate distributions
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI trusted publishing (OIDC); no token secrets needed
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # for sigstore signing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.1
        with:
          inputs: dist/*.tar.gz dist/*.whl
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes
