name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PY_COLORS: 1
  PYTEST_ADDOPTS: "--numprocesses=logical"

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      matrix:
        # oldest and newest supported, plus the everyday one
        python-version: ["3.10", "3.12", "3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"
          cache-suffix: pytest-${{ matrix.python-version }}
          cache-dependency-glob: "pyproject.toml"
      - name: install-reqs
        # narwhals comes editable from the pinned submodule via [tool.uv.sources]
        run: |
          git submodule update --init --recursive
          uv sync --group tests --extra extra-functions
      - name: show-deps
        run: uv pip freeze
      - name: Run local tests
        run: uv run --group tests pytest tests
      - name: Run narwhals test suite
        run: uv run --group tests python run_tests.py

  pytest-without-extra:
    # the base install must import and work; `mode`/`skew`/`kurtosis` raise
    # NotImplementedError pointing at the extra (tests/test_extra_functions.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"
          cache-suffix: pytest-without-extra
          cache-dependency-glob: "pyproject.toml"
      - name: install-reqs
        run: uv sync --group tests
      - name: Run local tests
        run: uv run --group tests pytest tests

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"
          cache-suffix: pyright
          cache-dependency-glob: "pyproject.toml"
      - name: install-reqs
        run: uv sync --group tests --group typing --extra extra-functions
      - name: Run pyright
        # the package, its tests, and the static narwhals Plugin-protocol check
        run: uv run --group typing pyright

  lint:
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks
        # same hooks contributors run locally: ruff format + check, codespell, typos
        run: uvx pre-commit run --all-files --show-diff-on-failure
