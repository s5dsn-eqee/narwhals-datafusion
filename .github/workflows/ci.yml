name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PY_COLORS: 1
  PYTEST_ADDOPTS: "--numprocesses=logical"

jobs:
  pytest:
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"
          cache-suffix: pytest-${{ matrix.python-version }}
          cache-dependency-glob: "pyproject.toml"
      - name: install-reqs
        # narwhals comes editable from the pinned submodule via [tool.uv.sources]
        run: |
          git submodule update --init --recursive
          uv sync --group tests
      - name: show-deps
        run: uv pip freeze
      - name: Run local tests
        run: uv run --group tests pytest tests
      - name: Run narwhals test suite
        run: uv run --group tests python run_tests.py

  lint:
    strategy:
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run ruff
        run: uvx ruff check .
