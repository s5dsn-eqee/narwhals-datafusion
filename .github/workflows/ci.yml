name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PY_COLORS: 1
  PYTEST_ADDOPTS: "--numprocesses=logical"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"
          cache-suffix: pytest
          cache-dependency-glob: "pyproject.toml"
      - name: install-reqs
        # narwhals is editable from the submodule ([tool.uv.sources])
        run: uv sync --group tests --extra extra-functions
      - name: show-deps
        run: uv pip freeze
      - name: Run local tests
        run: uv run --group tests pytest tests
      - name: Run narwhals test suite
        run: uv run --group tests python run_tests.py

  pytest-without-extra:
    # bare install: the extra's tests raise NotImplementedError or deselect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"
          cache-suffix: pytest-without-extra
          cache-dependency-glob: "pyproject.toml"
      - name: install-reqs
        run: uv sync --group tests
      - name: Run local tests
        run: uv run --group tests pytest tests
      - name: Run narwhals test suite
        run: uv run --group tests python run_tests.py

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "true"
          cache-suffix: pyright
          cache-dependency-glob: "pyproject.toml"
      - name: install-reqs
        run: uv sync --group tests --group typing --extra extra-functions
      - name: Run pyright
        # the package and the static narwhals Plugin-protocol check
        run: uv run --group typing pyright

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks
        # same hooks contributors run locally: ruff format + check, codespell, typos
        run: uvx pre-commit run --all-files --show-diff-on-failure
