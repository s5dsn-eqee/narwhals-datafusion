[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narwhals-datafusion"
# single source of truth: `__version__` in src/narwhals_datafusion/__init__.py
dynamic = ["version"]
description = "Apache DataFusion backend for Narwhals, via the Narwhals plugin system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  # Floors only, daft-style. This backend subclasses private `narwhals._sql`
  # internals, and datafusion-python majors change the Python API, so newer
  # releases can break it at runtime; the tested versions are the `narwhals/`
  # submodule tag and `uv.lock`, and the weekly workflow runs both suites on
  # the newest narwhals tag and the newest datafusion (see the release skill).
  "narwhals>=2.25",
  # floor: arithmetic over two aggregates inside `aggregate()` needs 54
  "datafusion>=54",
  "pyarrow>=14.0.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# `mode`/`skew`/`kurtosis` need this FFI shim (prebuilt wheels from
# https://github.com/s5dsn-eqee/datafusion-extra-functions-ffi). Without it
# those three raise NotImplementedError; everything else works. The shim's own
# dependency pin ties each shim minor to the datafusion major it was compiled
# against, so the resolver pairs them and no ceiling is needed here.
extra-functions = ["datafusion-extra-functions-ffi>=0.1"]

[project.urls]
Repository = "https://github.com/s5dsn-eqee/narwhals-datafusion"

[project.entry-points.'narwhals.plugins']
narwhals-datafusion = 'narwhals_datafusion'

[tool.hatch.version]
path = "src/narwhals_datafusion/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/narwhals_datafusion"]

[tool.hatch.build.targets.sdist]
# ship only what's needed to build the wheel; `narwhals/` is the dev submodule
exclude = [
  "docs", "narwhals", "tests", "tmp", ".github", ".hypothesis",
  "run_tests.py", "update_run_tests.py", "uv.lock",
  ".ai", ".claude", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", ".pre-commit-config.yaml",
  "test_plugin_protocol.py",
]

[dependency-groups]
# Deps for running narwhals' own suite from the `narwhals/` submodule
# (daft-style): `uv run --group tests python run_tests.py`.
tests = [
  "pytest>=9.0.3",
  "pytest-env",
  "pytest-randomly",
  "pytest-xdist",
  "hypothesis>=6.0.0",
  # eager targets for `collect(backend=...)`; also un-skips narwhals tests
  # that import them
  "pandas",
  "polars",
]
typing = ["pyright"]

[tool.uv.sources]
# narwhals comes editable from the pinned submodule (run
# `git submodule update --init` after cloning), so the plugin is always
# developed and tested against the exact internals it targets.
narwhals = { path = "narwhals", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

# daft-style: `uv run --group typing pyright` (CI runs it on 3.12)
[tool.pyright]
pythonPlatform = "All"
typeCheckingMode = "basic"
reportMissingTypeArgument = "error"
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportPrivateImportUsage = "none"
reportPrivateUsage = "none"
reportUnusedExpression = "none"
# `tests` is left out: every `nw.from_native(datafusion.DataFrame)` fails the
# `IntoLazyFrame` bound because datafusion's DataFrame has no `columns`
# property (see the ignores in dataframe.py).
include = ["src", "test_plugin_protocol.py"]
exclude = ["narwhals", ".venv"]

# Standalone lint config (decoupled from the narwhals repo's root settings).
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["narwhals"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "TC"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["narwhals_datafusion"]
