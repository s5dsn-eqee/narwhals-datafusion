[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narwhals-datafusion"
# single source of truth: `__version__` in src/narwhals_datafusion/__init__.py
dynamic = ["version"]
description = "Apache DataFusion backend for Narwhals, via the Narwhals plugin system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  # floor only; the tested release is the `narwhals/` submodule tag
  "narwhals>=2.25",
  # capped at the tested major; moves after both suites pass on the next one
  # (release skill). 54: aggregate arithmetic inside `aggregate()`
  "datafusion>=54,<55",
  "pyarrow>=14.0.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# `mode`/`skew`/`kurtosis`; prebuilt wheels from
# https://github.com/s5dsn-eqee/datafusion-extra-functions-ffi. Without it they
# raise NotImplementedError. Each shim minor pins its own datafusion major.
extra-functions = ["datafusion-extra-functions-ffi>=0.1"]

[project.urls]
Repository = "https://github.com/s5dsn-eqee/narwhals-datafusion"

[project.entry-points.'narwhals.plugins']
narwhals-datafusion = 'narwhals_datafusion'

[tool.hatch.version]
path = "src/narwhals_datafusion/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/narwhals_datafusion"]

[tool.hatch.build.targets.sdist]
# ship only what's needed to build the wheel; `narwhals/` is the dev submodule
exclude = [
  "docs", "narwhals", "tests", "tmp", ".github", ".hypothesis",
  "run_tests.py", "update_run_tests.py", "uv.lock",
  ".ai", ".claude", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", ".pre-commit-config.yaml",
  "test_plugin_protocol.py",
]

[dependency-groups]
# both test suites: `pytest tests` and `python run_tests.py`
tests = [
  "pytest>=9.0.3",
  "pytest-env",
  "pytest-randomly",
  "pytest-xdist",
  "hypothesis>=6.0.0",
  # `collect(backend=...)` targets; also un-skip narwhals tests that import them
  "pandas",
  "polars",
]
typing = ["pyright"]

[tool.uv.sources]
# editable from the submodule (`git submodule update --init` first)
narwhals = { path = "narwhals", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonPlatform = "All"
typeCheckingMode = "basic"
reportMissingTypeArgument = "error"
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportPrivateImportUsage = "none"
reportPrivateUsage = "none"
reportUnusedExpression = "none"
# no `tests`: `nw.from_native(datafusion.DataFrame)` fails the `IntoLazyFrame`
# bound (no `columns` property; see dataframe.py)
include = ["src", "test_plugin_protocol.py"]
exclude = ["narwhals", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["narwhals"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "TC"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["narwhals_datafusion"]
